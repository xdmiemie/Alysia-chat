enabled: false
provider: pyweixin
log_path: storage/logs/wechat_desktop/text.jsonl
dedup_path: storage/wechat_desktop/state/dedup.jsonl

account:
  account_key: role_account_main
  dedicated_account: true
  expected_display_name: set-after-validation

client:
  executable_names:
    - Weixin.exe
    - WeChat.exe
    - WeChatAppEx.exe
    - wechat_starter_v1.0.0.exe
  launch_if_missing: false
  require_logged_in: true
  require_unlocked_desktop: true
  verified_version: set-after-validation
  selector_profile: set-after-calibration
  pywechat_root: third_party/pywechat

monitor:
  mode: pinned_contacts
  poll_interval_ms: 100
  buffer_seconds: 0
  max_visible_sessions: 20
  ignore_group_chats: true
  ignore_system_messages: true

reply:
  default_mode: text
  min_reply_interval_seconds: 3
  fallback_to_text: true
  max_text_chars: 1000

voice:
  enabled: true
  capture_backend: application_loopback
  captured_dir: storage/wechat/incoming/captured
  normalized_dir: storage/wechat/incoming/normalized
  failed_dir: storage/wechat/failed
  ffmpeg_path: tools/ffmpeg/bin/ffmpeg.exe
  application_loopback_helper_path: tools/application_loopback_capture/application_loopback_capture.exe
  loopback_input_device: null
  capture_timeout_seconds: 20
  min_capture_ms: 300
  duration_tolerance_ms: 700
  silence_peak_threshold: 0.002
  max_capture_retries: 1
  relocation_scan_limit: 8
  delete_captured_after_success: true

calls:
  enabled: true
  auto_answer: true
  allow_video_calls: false
  default_policy: deny
  poll_interval_seconds: 0.2
  ring_wait_ms: 0
  max_call_seconds: 1800
  busy_behavior: ignore
  model_unhealthy_behavior: ignore
  duplicate_cooldown_seconds: 30
  post_call_failure_text: ""
  pause_message_polling_while_enabled: true
  # Stage 17 half-duplex call pipeline. The stable endpoint name takes
  # precedence over output_device; clear both to follow the Windows default.
  ai_enabled: true
  recordings_dir: storage/wechat/calls
  retain_audio: false
  output_device: null
  output_device_name: CABLE Input (VB-Audio Virtual Cable)
  listen_timeout_seconds: 30
  listen_guard_ms: 450
  max_consecutive_failures: 3
  vad_frame_ms: 30
  vad_pre_roll_ms: 450
  vad_speech_start_frames: 4
  vad_silence_end_ms: 750
  vad_min_speech_ms: 300
  vad_max_speech_ms: 25000

ui:
  operation_timeout_seconds: 15
  verify_chat_title_before_send: true
  verify_own_message_after_send: true
  allow_coordinate_fallback: false
  restore_window_after_operation: true
  max_send_retries: 2

scheduler:
  gpu_max_pending: 16
  ui_max_pending: 32
  ui_pause_max_pending: 8
  total_message_seconds: 240
  call_turn_seconds: 180
  cancel_pending_same_session: true
  restart_max_attempts: 2
  restart_window_seconds: 300
  restart_cooldown_seconds: 10

contacts:
  default_policy: deny
  allow_contact_keys: []
  allow_display_names:
    - n
    - L
    - 文件传输助手
  block_contact_keys: []
  call_enabled_contact_keys: []
  call_enabled_display_names: []
  call_disabled_contact_keys: []
