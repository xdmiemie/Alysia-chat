service_name: llama-server
host: 127.0.0.1
port: 8080
model_manifest: model_store/active/qwen3.json
# Shared by llama.cpp, AstrBot provider generation, and local model probes.
context_size: 32768
gpu_layers: 99
mmproj_offload: true
# Qwen3.5 visual detail floor and the per-image bound used by Q7 budgeting.
image_min_tokens: 1024
image_max_tokens: 4096
# The backend defaults to 8 GiB of host prompt cache; bound it on this 32 GiB PC.
prompt_cache_mib: 512
# Server arguments also disable automatic fit and enable flash attention:
# keep the configured GPU placement/context instead of silently downsizing.
cache_type_k: q8_0
cache_type_v: q8_0
enable_thinking: true
# Per-request phases; no extra model call to choose the switch.
thinking_agent: true
thinking_selection: true
thinking_followup: false
thinking_music_result: false
thinking_compression: false
reasoning_format: deepseek
reasoning_budget_tokens: 1024
context_margin_tokens: 256
temperature: 0.7
utility_temperature: 0.0
result_temperature: 0.5
top_p: 0.9
top_k: 20
max_tokens: 1536
max_history_turns: 8
# Legacy examples describe Elysia, conflicting with the current QQ persona.
few_shot_examples: 0
request_timeout_seconds: 60
character_config: configs/characters/elysia/character.yaml
system_prompt: configs/characters/elysia/system_prompt.txt
examples_path: configs/characters/elysia/examples.jsonl
