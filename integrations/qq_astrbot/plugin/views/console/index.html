<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼控制台</title><link rel="stylesheet" href="style.css"></head>
<body><div class="layout"><aside><div class="brand"><span class="fish">鱼</span><div>大肥鱼<small>ASTRBOT · 控制台</small></div></div><nav id="nav" aria-label="控制台栏目"></nav><div class="aside-note">配置、记忆与运行记录<br>与当前 AstrBot 实例同步</div></aside><main><header><div><div class="eyebrow">ASTRBOT CHAT</div><h1 id="title">抖音视频监控</h1><p id="description"></p></div><button id="refresh" class="secondary">刷新数据</button></header><div id="notice" role="status" aria-live="polite"></div><section id="overview" class="metrics"></section><div id="toolbar" class="toolbar"></div><section id="content" aria-live="polite"></section><div id="pagination" class="pagination"></div><footer>修改后的配置会显示生效状态。记忆页采用显示的有效 IANA 时区；其他时间按浏览器本地时区显示，用量趋势按 UTC 日汇总。</footer></main></div>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title"></h2><button type="button" id="close-dialog" class="icon" aria-label="关闭">×</button></div><div id="edit-body"></div><div id="edit-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">取消</button><button type="submit" id="save-dialog">保存</button></div></form></dialog><script src="app.js"></script></body></html>
